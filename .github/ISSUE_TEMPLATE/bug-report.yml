name: Bug report
description: Report a reproducible problem in Umbra.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real personal data, API keys, connector credentials, or other secrets into this issue.** Use synthetic examples and redact logs before posting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reproducible sequence using synthetic data.
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Surface or route
      placeholder: /app, /video, or /leak-check
  - type: input
    id: environment
    attributes:
      label: Browser and version
      placeholder: Chrome 130 on Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal data, API keys, and credentials before sharing.
